<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RACE DIALED // RIDER TWO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e5e5;
            margin: 0;
            overflow: hidden;
        }

        .font-mono {
            font-family: 'JetBrains+Mono', monospace;
        }

        /* Custom Scrollbar for the elite look */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #ef4444;
            border-radius: 10px;
        }

        /* Animations */
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .animate-pulse-red {
            animation: pulse-red 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            Activity, Settings, Wrench, Shield, Video, 
            ChevronRight, AlertTriangle, CheckCircle, 
            Battery, Zap, Gauge, Crosshair, Bike, 
            Camera, ArrowUpCircle, X, Loader2, Send 
        } = lucideReact;

        // --- DATA CONSTANTS ---
        const RIDER = { weight: 73, height: "5'10\"", discipline: "Downhill MTB" };
        const BIKE = {
            frame: "Commencal V4 DH",
            fork: "2017 RockShox Boxxer",
            shock: "RockShox Vivid Coil",
            hubs: "Hope Pro 4",
            drivetrain: "Shimano Zee",
            wheels: "Spank Alloy",
            tyres: "Maxxis DHF (F) / DHR (R)",
            cockpit: "ENVE Carbon Bars / Leatt Grips",
            brakes: "SRAM Code RS"
        };

        // --- GEMINI API CORE ---
        const callGeminiAPI = async (prompt, systemInstruction) => {
            const apiKey = ""; // Set by environment
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let attempt = 0; attempt < 5; attempt++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "NO DATA RETURNED.";
                } catch (error) {
                    if (attempt === 4) return "SYSTEM OFFLINE. LOCAL CACHE ONLY.";
                    await new Promise(res => setTimeout(res, delays[attempt]));
                }
            }
        };

        // --- REUSABLE COMPONENTS ---
        const NavItem = ({ icon, label, isActive, onClick }) => (
            <button onClick={onClick} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-bold tracking-wide transition-all duration-300 ${isActive ? 'bg-white/10 text-white border border-white/10 shadow-[inset_0_1px_0_rgba(255,255,255,0.1)]' : 'text-neutral-500 hover:text-neutral-300 hover:bg-white/5'}`}>
                {React.createElement(icon, { size: 18, className: isActive ? 'text-red-500' : '' })}
                {label}
                {isActive && <ChevronRight size={14} className="ml-auto text-neutral-600" />}
            </button>
        );

        const GaugeCard = ({ label, value, color, warning }) => (
            <div className="bg-[#111] p-4 rounded-xl border border-white/5 flex flex-col">
                <span className="text-[10px] font-bold text-neutral-500 uppercase tracking-widest mb-2">{label}</span>
                <div className="flex items-end gap-2 mb-2">
                    <span className={`text-3xl font-black ${warning ? 'text-red-500' : 'text-white'}`}>{value}</span>
                    <span className="text-xs text-neutral-600 mb-1 font-mono">%</span>
                </div>
                <div className="w-full h-1.5 bg-white/10 rounded-full overflow-hidden mt-auto">
                    <div className={`h-full ${color} transition-all duration-1000`} style={{ width: `${value}%` }}></div>
                </div>
            </div>
        );

        // --- VIEWS ---
        const DashboardView = () => (
            <div className="space-y-8 animate-in fade-in duration-500">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-white/10 pb-6 gap-4">
                    <div>
                        <h1 className="text-4xl md:text-6xl font-black tracking-tighter text-white mb-2 uppercase">FULLY DIALED<br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-red-600 to-red-400">// READY TO SEND</span></h1>
                        <p className="text-neutral-400 font-mono text-sm uppercase tracking-widest">{BIKE.frame} • 73KG MASS • ELITE SPEC</p>
                    </div>
                    <div className="text-right font-mono bg-[#1a1a1a] p-4 rounded-xl border border-red-500/30">
                        <p className="text-[10px] text-red-500 font-black tracking-widest">RACE COUNTDOWN</p>
                        <p className="text-2xl text-white font-black">T-14 DAYS</p>
                    </div>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <GaugeCard label="Front Grip Score" value={92} color="bg-green-500" />
                    <GaugeCard label="Brake Confidence" value={88} color="bg-blue-500" />
                    <GaugeCard label="Jump Support" value={95} color="bg-purple-500" />
                    <GaugeCard label="Mechanical Risk" value={60} color="bg-red-500" warning />
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="p-5 rounded-2xl border border-red-500/50 bg-red-950/20 flex gap-4">
                        <AlertTriangle className="text-red-500 shrink-0" />
                        <div>
                            <h3 className="text-sm font-bold text-red-500 tracking-widest">CRITICAL MECHANICAL</h3>
                            <p className="text-xs text-neutral-400 font-mono">Shimano Zee Rear Derailleur failure detected. Replace immediately.</p>
                        </div>
                    </div>
                    <div className="p-5 rounded-2xl border border-red-500/50 bg-red-950/20 flex gap-4">
                        <Wrench className="text-red-500 shrink-0" />
                        <div>
                            <h3 className="text-sm font-bold text-red-500 tracking-widest">MAINTENANCE ALERT</h3>
                            <p className="text-xs text-neutral-400 font-mono">Idler cog friction levels critical. Replacement required for drivetrain efficiency.</p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const JarvisModal = ({ onClose }) => {
            const [query, setQuery] = useState('');
            const [chat, setChat] = useState([{ role: 'ai', text: "UPLINK ESTABLISHED. I have your Commencal V4 telemetry. What is your mechanical query?" }]);
            const [loading, setLoading] = useState(false);
            const chatEndRef = useRef(null);

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chat]);

            const sendQuery = async () => {
                if (!query.trim()) return;
                const userMsg = query;
                setQuery('');
                setChat(prev => [...prev, { role: 'user', text: userMsg }]);
                setLoading(true);

                const sys = "You are Jarvis, World Cup DH AI. Rider: 73kg. Bike: Commencal V4 DH. Components: 2017 Boxxer, Zee (broken), Vivid Coil. Tone: Technical, aggressive, elite. Format: Step-by-step or punchy data points.";
                const res = await callGeminiAPI(userMsg, sys);
                setChat(prev => [...prev, { role: 'ai', text: res }]);
                setLoading(false);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                    <div className="w-full max-w-lg bg-[#111] border border-red-500/30 rounded-2xl flex flex-col h-[600px] shadow-2xl overflow-hidden">
                        <div className="p-4 border-b border-white/10 flex justify-between items-center bg-[#151515]">
                            <div className="flex items-center gap-2">
                                <Zap className="text-red-500" size={18} />
                                <span className="text-xs font-black tracking-widest text-white uppercase font-mono">JARVIS // MEC-LINK</span>
                            </div>
                            <button onClick={onClose} className="text-neutral-500 hover:text-white"><X size={20}/></button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-4 font-mono text-sm">
                            {chat.map((m, i) => (
                                <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`p-3 rounded-xl max-w-[85%] ${m.role === 'user' ? 'bg-red-600 text-white' : 'bg-white/5 text-neutral-300 border border-white/10'}`}>
                                        {m.text}
                                    </div>
                                </div>
                            ))}
                            {loading && <div className="text-red-500 animate-pulse text-xs">ANALYZING DATABANKS...</div>}
                            <div ref={chatEndRef} />
                        </div>
                        <div className="p-4 bg-[#0a0a0a] border-t border-white/10 flex gap-2">
                            <input value={query} onChange={e => setQuery(e.target.value)} onKeyDown={e => e.key === 'Enter' && sendQuery()} className="flex-1 bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-sm focus:border-red-500 outline-none text-white font-mono" placeholder="Query Mechanic..." />
                            <button onClick={sendQuery} className="bg-red-600 p-2 rounded-lg text-white"><Send size={18}/></button>
                        </div>
                    </div>
                </div>
            );
        };

        const MainApp = () => {
            const [tab, setTab] = useState('dashboard');
            const [jarvis, setJarvis] = useState(false);

            return (
                <div className="flex h-screen w-full flex-col md:flex-row bg-[#0a0a0a]">
                    <aside className="md:w-64 bg-[#111] border-r border-white/10 p-6 flex flex-col z-10 shadow-2xl">
                        <div className="mb-10">
                            <h1 className="text-2xl font-black tracking-tighter text-white">RACE DIALED</h1>
                            <p className="text-[10px] font-black tracking-[0.3em] text-red-600 uppercase">Rider Two // 73KG</p>
                        </div>
                        <div className="space-y-1">
                            <NavItem icon={Activity} label="Telemetry" isActive={tab === 'dashboard'} onClick={() => setTab('dashboard')} />
                            <NavItem icon={Settings} label="Setup Matrix" isActive={tab === 'setup'} onClick={() => setTab('setup')} />
                            <NavItem icon={Wrench} label="Service" isActive={tab === 'service'} onClick={() => setTab('service')} />
                            <NavItem icon={Shield} label="Gear Lab" isActive={tab === 'gear'} onClick={() => setTab('gear')} />
                            <NavItem icon={ArrowUpCircle} label="Upgrades" isActive={tab === 'upgrades'} onClick={() => setTab('upgrades')} />
                        </div>
                        <div className="mt-auto p-4 glass-panel rounded-xl">
                            <div className="flex items-center gap-2 mb-1">
                                <div className="w-2 h-2 bg-red-600 rounded-full animate-pulse"></div>
                                <span className="text-[10px] font-black text-white uppercase tracking-widest font-mono">Uplink Stable</span>
                            </div>
                            <p className="text-[9px] text-neutral-500 font-mono">V4 CHASSIS ENGAGED</p>
                        </div>
                    </aside>

                    <main className="flex-1 overflow-y-auto p-6 md:p-12 relative scroll-smooth">
                        <div className="absolute top-0 right-0 w-[600px] h-[600px] bg-red-600/5 rounded-full blur-[120px] pointer-events-none"></div>
                        <div className="max-w-5xl mx-auto">
                            {tab === 'dashboard' && <DashboardView />}
                            {tab === 'setup' && <div className="text-neutral-500 font-mono uppercase tracking-[0.5em] flex items-center justify-center h-[50vh]">Setup Matrix Loaded</div>}
                            {tab === 'service' && <div className="text-neutral-500 font-mono uppercase tracking-[0.5em] flex items-center justify-center h-[50vh]">Service Center Syncing</div>}
                        </div>
                    </main>

                    <div className="fixed bottom-8 right-8 z-50 cursor-pointer" onClick={() => setJarvis(true)}>
                        <div className="absolute inset-0 bg-red-600/40 rounded-full blur-lg animate-pulse"></div>
                        <button className="relative w-16 h-16 bg-[#111] border border-red-500/50 rounded-full flex items-center justify-center text-red-500 hover:text-white hover:bg-red-600 transition-all shadow-2xl">
                            <Zap size={28} />
                        </button>
                    </div>
                    {jarvis && <JarvisModal onClose={() => setJarvis(false)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
